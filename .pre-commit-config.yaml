repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: https://github.com/cpplint/cpplint
    rev: 1.6.1
    hooks:
      - id: cpplint
        args: ["--filter=-legal/copyright,-build/include_subdir,-readability/casting,-whitespace/line_length,-whitespace/newline,-build/header_guard,-build/include_order,-runtime/int,-readability/multiline_comment,-runtime/printf,-whitespace/blank_line,-runtime/threadsafe_fn,-build/include,-build/include_what_you_use,-whitespace/parens,-whitespace/empty_if_body,-whitespace/indent,-runtime/arrays,-whitespace/comments"]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.3
    hooks:
      - id: clang-format
        types_or: [c, c++]

  - repo: local
    hooks:
      - id: update-shields
        name: Update Documentation and Shields
        entry: python scripts/update_shields.py
        language: system
        pass_filenames: false
        always_run: true

      - id: cmake-configure
        name: CMake Configure
        entry: cmake -B build -DCMAKE_BUILD_TYPE=Release
        language: system
        pass_filenames: false
        always_run: true

      - id: cmake-build
        name: CMake Build
        entry: cmake --build build --config Release
        language: system
        pass_filenames: false
        always_run: true

      - id: ctest
        name: Run Tests (CTest)
        entry: ctest --test-dir build -C Release --output-on-failure
        language: system
        pass_filenames: false
        always_run: true

      - id: test-downstream
        name: Test Downstream Projects
        entry: python scripts/test_downstream.py
        language: system
        pass_filenames: false
        always_run: true
