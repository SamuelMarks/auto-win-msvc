name: Downstream Integration

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test-downstream:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [valkey, redis, rsync]

    steps:
      - name: Checkout auto-win-msvc
        uses: actions/checkout@v4
        with:
          path: auto-win-msvc

      - name: Checkout valkey-windows
        if: matrix.project == 'valkey'
        uses: actions/checkout@v4
        with:
          repository: SamuelMarks/valkey-windows
          ref: release-9.1.0-fix
          path: valkey-windows

      - name: Checkout redis-windows
        if: matrix.project == 'redis'
        uses: actions/checkout@v4
        with:
          repository: SamuelMarks/redis-windows
          path: redis-windows

      - name: Checkout rsync
        if: matrix.project == 'rsync'
        uses: actions/checkout@v4
        with:
          repository: SamuelMarks/rsync
          ref: windows
          path: rsync

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build valkey-windows
        if: matrix.project == 'valkey'
        shell: cmd
        run: |
          xcopy /E /I auto-win-msvc valkey-windows\auto-win-msvc
          cd valkey-windows
          python -c "c = open('release.bat').read().replace('Visual Studio 18 2026', 'Visual Studio 17 2022'); open('release.bat', 'w').write(c)"
          call release.bat 9.1.0 --local-only

      - name: Build redis-windows
        if: matrix.project == 'redis'
        shell: cmd
        run: |
          mkdir redis-windows\build_work
          xcopy /E /I auto-win-msvc redis-windows\build_work\auto-win-msvc
          cd redis-windows
          python -c "c = open('build-and-release.bat').read().replace('Visual Studio 18 2026', 'Visual Studio 17 2022'); open('build-and-release.bat', 'w').write(c)"
          call build-and-release.bat 8.8-rc1 redis --local-only

      - name: Build rsync
        if: matrix.project == 'rsync'
        shell: cmd
        run: |
          cd /d "%VCPKG_INSTALLATION_ROOT%" && git fetch --all || true
          cd /d "%GITHUB_WORKSPACE%"
          cd rsync
          cmake -G "Visual Studio 17 2022" -A x64 -B build -S . -DFETCHCONTENT_SOURCE_DIR_AUTO_WIN_MSVC=../auto-win-msvc -DCMAKE_TOOLCHAIN_FILE="%VCPKG_INSTALLATION_ROOT%\scripts\buildsystems\vcpkg.cmake"
          cmake --build build --config Release
