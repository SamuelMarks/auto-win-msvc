name: Downstream Integration

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test-downstream:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [valkey, redis, rsync, memcached, dash]

    steps:
      - name: Checkout auto-win-msvc
        uses: actions/checkout@v7
        with:
          path: auto-win-msvc

      - name: Checkout valkey-windows
        if: matrix.project == 'valkey'
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/valkey-windows
          ref: master
          path: valkey-windows

      - name: Checkout redis-windows
        if: matrix.project == 'redis'
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/redis-windows
          ref: 8.10.2
          path: redis-windows

      - name: Checkout rsync
        if: matrix.project == 'rsync'
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/rsync
          ref: windows
          path: rsync

      - name: Checkout memcached
        if: matrix.project == 'memcached'
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/memcached
          ref: msvc
          path: memcached

      - name: Checkout dash-windows
        if: matrix.project == 'dash'
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/dash-windows
          ref: master
          path: dash-windows

      - name: Checkout dash
        if: matrix.project == 'dash'
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/dash
          ref: v0.5.13.5
          path: dash-windows/dash

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install NSIS
        if: matrix.project == 'valkey' || matrix.project == 'redis'
        run: |
          choco install nsis -y
          Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\NSIS"

      - name: Build valkey-windows
        if: matrix.project == 'valkey'
        shell: cmd
        run: |
          xcopy /E /I auto-win-msvc valkey-windows\auto-win-msvc
          cd valkey-windows
          python -c "c = open('release.bat').read().replace('timeout /t 3 /nobreak > nul', 'ping 127.0.0.1 -n 4 > nul').replace('-G \"Visual Studio 17 2022\"', '').replace('$\\\"$INSTDIR', '\\\"$INSTDIR'); open('release.bat', 'w').write(c)"
          call release.bat 9.1.2 --local-only

      - name: Build redis-windows
        if: matrix.project == 'redis'
        shell: cmd
        run: |
          cd redis-windows
          (echo [submodule "build_work/redis"] & echo path = build_work/redis & echo url = https://github.com/redis/redis.git) > .gitmodules
          python -c "c = open('build-and-release.bat').read().replace('rmdir /s /q \"%%WORK_DIR%%\"', 'rmdir /s /q \"%%SRC_DIR%%\" 2>nul').replace('ctest -C Release --output-on-failure', 'ctest -C Release -R internal- --output-on-failure'); open('build-and-release.bat', 'w').write(c)"
          mkdir build_work\auto-win-msvc
          xcopy /E /I /Y ..\auto-win-msvc build_work\auto-win-msvc
          call build-and-release.bat 8.10.2 redis --local-only

      - name: Build rsync
        if: matrix.project == 'rsync'
        shell: cmd
        run: |
          cd /d "%VCPKG_INSTALLATION_ROOT%" && git fetch --all || true
          cd /d "%GITHUB_WORKSPACE%"
          cd rsync
          cmake -B build -S . -DFETCHCONTENT_SOURCE_DIR_AUTO_WIN_MSVC=../auto-win-msvc -DCMAKE_TOOLCHAIN_FILE="%VCPKG_INSTALLATION_ROOT%\scripts\buildsystems\vcpkg.cmake"
          cmake --build build --config Release

      - name: Build memcached
        if: matrix.project == 'memcached'
        shell: cmd
        run: |
          cd memcached
          cmake -B build -S . -DFETCHCONTENT_SOURCE_DIR_AUTO-WIN-MSVC=../auto-win-msvc
          cmake --build build --config Release
          build\Release\memcached.exe -h
          build\Release\sizes.exe

      - name: Build dash
        if: matrix.project == 'dash'
        shell: cmd
        run: |
          cd dash-windows
          git -C dash apply --ignore-whitespace patches/0001-Windows-native-builds.patch 2>nul || cd .
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DFETCHCONTENT_SOURCE_DIR_AUTO_WIN_MSVC=../auto-win-msvc -DDASH_SOURCE_DIR=dash
          cmake --build build --config Release
          ctest --test-dir build -C Release --output-on-failure
          if exist build\dash_build\Release\dash.exe (
              build\dash_build\Release\dash.exe -c "echo DASH native Windows build successful"
          ) else if exist build\Release\dash.exe (
              build\Release\dash.exe -c "echo DASH native Windows build successful"
          ) else (
              build\dash.exe -c "echo DASH native Windows build successful"
          )
