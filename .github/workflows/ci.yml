name: MSVC POSIX Monorepo CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  check-patches:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@master
      - name: Verify PATCH_COMMAND files exist and are tracked
        run: python3 scripts/check_patches.py

  ci:
    uses: SamuelMarks/c-ci/.github/workflows/c-cmake-ci.yml@master
    with:
      cmake_configure_flags: '-DBUILD_TESTING=ON'
      extra_cygwin_packages: 'git'
      msdos_testing: true
